version: "3.9"

services:

  # ── FastAPI backend ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jamaicahealthops-api
    ports:
      - "8000:8000"
    environment:
      - DS_DATA_PATH=/data
    volumes:
      # Mount your DS data folder (read-only) — only this, no source mount
      - ${DS_DATA_PATH}:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jamaicahealthops-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      # Mount frontend source so HTML changes show without rebuild
      - ./frontend:/usr/share/nginx/html

networks:
  default:
    name: jamaicahealthops-network
