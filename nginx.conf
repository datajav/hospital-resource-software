server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index jamaica_health_ops_dashboard.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /jamaica_health_ops_dashboard.html;
    }

    # Health check endpoint
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
